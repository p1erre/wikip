[pytest]
# Pytest configuration for video-to-book project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    integration: marks tests as integration tests (make real API calls, slow)
    unit: marks tests as unit tests (fast, no external dependencies)
    slow: marks tests as slow running

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test paths
testpaths = tests

# Coverage options (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=src --cov-report=html --cov-report=term

# Ignore patterns
norecursedirs = .git .tox dist build *.egg __pycache__ .venv venv

# Logging
log_cli = false
log_cli_level = INFO
