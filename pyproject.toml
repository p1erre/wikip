[project]
name = "video-to-booklet"
version = "0.2.0"
description = "Claude Code skills that turn YouTube videos into markdown booklets"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Pierre Rosado"}
]

dependencies = [
    "yt-dlp>=2024.0.0",
    "youtube-transcript-api>=0.6.0",
    "opencv-python>=4.8.0",
    "scikit-image>=0.21.0",
    "pillow>=10.0.0",
    "imagehash>=4.3.1",
    "numpy>=1.26.0",
    "pymupdf>=1.24.0",
    "marker-pdf>=0.3.0",
    "nougat-ocr>=0.1.17",
    "ocrmypdf>=16.0.0",
    "pylatexenc>=2.10",
    "httpx>=0.27.0",
    "readability-lxml>=0.8.1",
    "markdownify>=0.13.1",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40.0"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]
